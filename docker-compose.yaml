services:

  slimtorq-control:
    image: phillipmaree/slimtorq-control:latest
    build:
      context: .
      dockerfile: ./compose/control/Dockerfile
    ports:
      - 8080:8080
    environment:
      - DASH_HOST=0.0.0.0
      - DASH_PORT=8080
      - DASH_DEBUG=0
    networks:
      - network_bridge

networks:
  network_bridge:
    driver: bridge
