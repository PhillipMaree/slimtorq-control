app:
  name: "slimtorq-control"
  host: "0.0.0.0"
  port: 8000
  version: "0.1.0"
  log_config_file: "logging.yaml"
  log_level: "info"
cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allow_methods: ["GET", "POST"]
  allow_headers: ["*"]
frontend:
  dist_dir: "frontend/out"
artifacts:
  dir: ".temp"
catalog:
  path: "config/catalog.yaml"
