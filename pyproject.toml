[project]
name = "slimtorq-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "fmpy>=0.3.29",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.47.0",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
explicit_package_bases = true
disable_error_code = ["arg-type", "return-value", "assignment", "attr-defined", "call-arg", "override", "union-attr"]

[tool.ruff]
    line-length = 180
    extend-exclude = ["sandbox"]

[tool.ruff.lint]
# Enable pycodestyle, pyflakes, isort, and more
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Control-engineering convention: keep textbook symbol casing (Kp, Ki, R_s,
# L_s, psi_m, Vdc, T_e, T_L, TL, Tf, V_max, A1/A2/A3 …). Renaming to
# snake_case would break the link to equations in module docstrings.
"src/*.py" = ["N803", "N806", "N802"]
# Tuning + controller docstrings deliberately use Greek symbols (σ, θ, ω,
# ψ, τ) to mirror the math; they are never executed as code.
"src/tuning.py" = ["N803", "N806", "N802", "RUF002"]
"src/controller.py" = ["N803", "N806", "N802", "RUF002"]
"src/model.py" = ["N803", "N806", "N802", "RUF002"]
"src/observer.py" = ["N803", "N806", "N802", "RUF002"]
"src/simulator.py" = ["N803", "N806", "N802", "RUF002"]
"tests/*.py" = ["N803", "N806", "N802", "RUF002"]

[tool.coverage.run]
source = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
